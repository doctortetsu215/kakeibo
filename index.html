<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ふたりの家計簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first single column — ヘッダー → 月カレンダー → 選んだ日の予定 → 右下の「＋予定」。登録は下から出るシート。
   Direction: やわらかいパステル × 余白 × 細いセリフ数字で、上品でかわいいカレンダー */
:root{
  --bg:#faf6f8; --bg2:#f3eef8; --card:#ffffff; --ink:#4d4558; --muted:#9e94a8; --hair:#eee6ef; --soft:#f7f2f7;
  --p1:#a8c6ec; --p1s:#edf3fc; --p1d:#5f86b8;   /* 哲也：パウダーブルー */
  --p2:#f1b3c7; --p2s:#fdeff3; --p2d:#c76a8a;   /* 菜々子：ダスティピンク */
  --p3:#ecd29a; --p3s:#fbf5e6; --p3d:#a88a45;   /* ふたり：シャンパン */
  --rose:#e7a4b6; --lav:#c9b8ea; --sun:#d98aa0; --sat:#7f9fd0;
  --today:#e7a4b6; --today-ink:#ffffff;
  --shadow:0 10px 30px rgba(120,90,130,.08),0 2px 6px rgba(120,90,130,.05);
  --shadow-sm:0 4px 12px rgba(120,90,130,.08);
  --font-display:"Cormorant Garamond","Zen Maru Gothic",serif;
  --font-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f1b24; --bg2:#262030; --card:#2b2633; --ink:#f1eaf3; --muted:#a99fb3; --hair:#3a3343; --soft:#332d3c;
  --p1s:#2a3445; --p1d:#a9c6ef; --p2s:#40303a; --p2d:#f3b8ca; --p3s:#3d3627; --p3d:#ecd29a;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-sm:0 4px 12px rgba(0,0,0,.3); --today-ink:#2b2633;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f1b24; --bg2:#262030; --card:#2b2633; --ink:#f1eaf3; --muted:#a99fb3; --hair:#3a3343; --soft:#332d3c;
  --p1s:#2a3445; --p1d:#a9c6ef; --p2s:#40303a; --p2d:#f3b8ca; --p3s:#3d3627; --p3d:#ecd29a;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-sm:0 4px 12px rgba(0,0,0,.3); --today-ink:#2b2633;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 340px);background-color:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;min-height:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:22px 112px;display:flex;flex-direction:column;gap:18px}

header{display:flex;align-items:center;gap:14px;padding-inline:4px}
.logo{flex:none;width:46px;height:46px}
h1{font-family:var(--font-body);font-weight:700;font-size:1.2rem;letter-spacing:.08em;line-height:1.3;margin:0}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-inline:2px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:40px;height:40px}
.brand h1{font-size:1.05rem}
.appnav{flex:none;display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--card);box-shadow:var(--shadow-sm)}
.appnav a{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;font-size:.76rem;color:var(--muted);text-decoration:none;white-space:nowrap}
.appnav a svg{width:14px;height:14px;flex:none}
.appnav a[aria-current="page"]{background:linear-gradient(135deg,#fbe3ea,#ece4fa);color:#4d4558;font-weight:700}
.brand h1{white-space:nowrap}
.brand>div{min-width:0}
@media (max-width:430px){.appnav a svg{display:none}.appnav a{padding:6px 10px}.brand h1{font-size:.98rem}.brand .logo{width:34px;height:34px}}
@media (max-width:350px){.appnav a{padding:6px 7px;font-size:.7rem}}
.names{display:flex;gap:10px;margin-top:1px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;color:var(--muted);letter-spacing:.04em}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--pc);display:inline-block}

.card{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.calcard{padding:16px 10px 18px}
.calcard>.monthbar,.calcard>.toolbar,.calcard>.summary{margin-inline:6px}

.monthbar{display:flex;align-items:center;gap:8px}
.mtitle{flex:1;text-align:center;font-family:var(--font-display);font-weight:500;font-size:2.3rem;line-height:1;letter-spacing:.02em}
.mtitle small{display:block;font-family:var(--font-display);font-size:.9rem;color:var(--muted);letter-spacing:.3em;margin-bottom:4px;font-weight:600}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--hair);background:var(--card);font-size:1.3rem;cursor:pointer;display:grid;place-items:center;color:var(--muted);transition:background .2s}
.round:hover{background:var(--soft)}
.todaybtn{border:1px solid var(--hair);background:transparent;border-radius:999px;padding:5px 16px;font-size:.78rem;letter-spacing:.06em;color:var(--muted);cursor:pointer}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--soft)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:.8rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm);font-weight:700}
.seg i{width:8px;height:8px;border-radius:50%;background:var(--pc);display:inline-block}

.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow span{text-align:center;font-size:.68rem;letter-spacing:.1em;color:var(--muted);padding-bottom:4px}
.dow span:first-child{color:var(--sun)} .dow span:last-child{color:var(--sat)}
.day{position:relative;min-height:80px;border:1px solid transparent;border-radius:14px;background:transparent;padding:3px 2px 4px;display:flex;flex-direction:column;align-items:stretch;gap:2px;cursor:pointer;text-align:left;min-width:0;overflow:hidden;transition:background .2s}
.day:hover{background:var(--soft)}
.day .dn{font-family:var(--font-display);font-weight:600;font-size:1.02rem;line-height:1;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;align-self:center;margin-bottom:1px}
.day.sun .dn{color:var(--sun)} .day.sat .dn{color:var(--sat)}
.day.out{opacity:.32}
.day.today .dn{background:var(--today);color:var(--today-ink)}
.day.sel{background:var(--soft);border-color:var(--hair)}
.meals{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.pill{font-size:.56rem;line-height:1;padding:2px 4px;border-radius:999px;background:var(--ps);color:var(--pd);white-space:nowrap;font-weight:700}
.bar{display:block;font-size:.58rem;line-height:1.3;padding:2px 4px;border-radius:6px;background:var(--pc);color:#4d4558;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.bar.cont{opacity:.7}
.more{font-size:.58rem;color:var(--muted);text-align:center}

.summary{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:center;font-size:.76rem;color:var(--muted);border-top:1px solid var(--hair);padding-top:12px}
.summary b{font-family:var(--font-display);font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.summary .who{display:inline-flex;align-items:center;gap:5px}
.summary .who i{width:8px;height:8px;border-radius:50%;background:var(--pc)}

.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
h2{font-weight:700;font-size:1.02rem;letter-spacing:.06em;margin:0}
.quick{display:flex;flex-direction:column;gap:10px;background:var(--soft);border-radius:20px;padding:12px 14px}
.quick .lbl{font-size:.72rem;letter-spacing:.08em;color:var(--muted)}
.quick .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quick .seg{background:var(--card)}
.qbtn{border:1px solid var(--hair);background:var(--card);border-radius:999px;padding:7px 15px;font-size:.84rem;cursor:pointer;color:var(--ink);transition:background .2s}
.qbtn[aria-pressed="true"]{background:var(--pc);border-color:transparent;color:#4d4558;font-weight:700}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;border:0;background:var(--ps);border-radius:18px;padding:11px 14px;cursor:pointer;transition:transform .15s}
.item:active{transform:scale(.99)}
.ava{width:34px;height:34px;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:.78rem;font-weight:700;color:#4d4558}
.item .info{min-width:0}
.item .t{display:block;font-weight:700;overflow-wrap:anywhere}
.item .s{display:block;font-size:.74rem;color:var(--muted)}
.item .tm{font-family:var(--font-display);font-weight:600;font-size:.95rem;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--pd)}
.empty{text-align:center;color:var(--muted);font-size:.86rem;padding:10px 0}
.dgroup{display:flex;flex-direction:column;gap:6px;padding-inline:6px}
.dgroup h3{margin:8px 0 0;font-size:.8rem;letter-spacing:.06em;font-weight:700}
.dgroup h3.sun{color:var(--sun)} .dgroup h3.sat{color:var(--sat)}

.note{font-size:.74rem;color:var(--muted);text-align:center;margin:0}
.demo{background:var(--card);border-radius:18px;padding:10px 14px;font-size:.78rem;color:var(--muted);box-shadow:var(--shadow-sm);margin:0}

.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:5;border:0;background:linear-gradient(135deg,#f3b6c8,#cdb9ee);color:#fff;border-radius:999px;padding:14px 24px;font-weight:700;letter-spacing:.08em;font-size:.95rem;cursor:pointer;box-shadow:0 10px 24px rgba(205,150,190,.45)}
.fab:active{transform:scale(.97)}

.overlay{position:fixed;inset:0;z-index:10;background:rgba(60,45,70,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:620px;max-height:92%;overflow-y:auto;background:var(--card);border-radius:30px 30px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;box-shadow:0 -10px 40px rgba(80,50,90,.15)}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--hair);align-self:center}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:0;background:var(--soft);border-radius:50%;width:34px;height:34px;cursor:pointer;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.label{font-size:.72rem;letter-spacing:.08em;color:var(--muted)}
.whos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.whobtn{border:1px solid var(--hair);background:var(--card);border-radius:18px;padding:12px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.88rem;transition:background .2s}
.whobtn .ava{width:30px;height:30px;font-size:.72rem}
.whobtn[aria-pressed="true"]{background:var(--ps);border-color:var(--pc);font-weight:700;box-shadow:0 0 0 1px var(--pc) inset}
.cats{display:flex;flex-wrap:wrap;gap:7px}
.cat{border:1px solid var(--hair);background:var(--card);border-radius:999px;padding:6px 13px;font-size:.82rem;cursor:pointer;color:var(--ink);transition:background .2s}
.cat[aria-pressed="true"]{background:linear-gradient(135deg,#fbe3ea,#ece4fa);border-color:transparent;font-weight:700;color:#4d4558}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=date],input[type=time],textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:14px;padding:10px 12px;width:100%;min-width:0;transition:border-color .2s,background .2s}
input:focus,textarea:focus{background:var(--card);border-color:var(--rose);outline:none}
textarea{resize:vertical;min-height:60px}
.check{display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:#e7a4b6}
.checks{display:flex;gap:18px;flex-wrap:wrap}
.actions{display:flex;gap:10px}
.save{flex:1;border:0;background:linear-gradient(135deg,#f3b6c8,#cdb9ee);color:#fff;border-radius:999px;padding:14px;font-weight:700;letter-spacing:.1em;font-size:1rem;cursor:pointer;box-shadow:0 8px 20px rgba(205,150,190,.35)}
.save:disabled{opacity:.6}
.del{border:1px solid var(--hair);background:var(--card);border-radius:999px;padding:0 18px;cursor:pointer;color:var(--sun);font-size:.86rem}
.del.confirm{background:var(--sun);border-color:transparent;color:#fff;font-weight:700}
.msg{font-size:.82rem;color:var(--sun);margin:0;min-height:1.2em}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--card);color:var(--ink);box-shadow:var(--shadow);border-radius:999px;padding:9px 18px;font-size:.84rem;max-width:calc(100% - 32px);text-align:center}

button:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.login{position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,var(--bg2),var(--bg));display:flex;align-items:center;justify-content:center;padding:24px 16px}
.loginbox{width:100%;max-width:360px;background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:28px 22px;display:flex;flex-direction:column;gap:14px;text-align:center}
.loginbox .logo{width:64px;height:64px;align-self:center}
.loginbox p{margin:0;color:var(--muted);font-size:.84rem}
.loginbox input{text-align:center;font-size:1.05rem;letter-spacing:.1em}
.logout{border:0;background:transparent;color:var(--muted);font-size:.74rem;text-decoration:underline;cursor:pointer;padding:4px}
@media (max-width:380px){.day{min-height:74px}.bar{font-size:.55rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 家計簿 */
h2{font-size:1rem}
.kform{display:flex;flex-direction:column;gap:16px}
.amount{position:relative}
.amount input{font-family:var(--font-display);font-weight:600;font-size:2rem;padding:8px 14px 8px 40px;font-variant-numeric:tabular-nums;background:var(--soft);border:1px solid transparent;border-radius:18px;width:100%;color:var(--ink)}
.amount input:focus{background:var(--card);border-color:var(--rose);outline:none}
.amount span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-family:var(--font-display);font-size:1.5rem;color:var(--muted)}
.cat .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.cat:disabled{opacity:.35;cursor:not-allowed}
.total{text-align:center;display:flex;flex-direction:column;gap:2px}
.total .num{font-family:var(--font-display);font-weight:600;font-size:2.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.paygrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.paytile{background:var(--ps);border-radius:18px;padding:10px 6px;text-align:center;min-width:0}
.paytile small{display:flex;align-items:center;justify-content:center;gap:5px;font-size:.72rem;color:var(--muted)}
.paytile small i{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.paytile b{display:block;font-family:var(--font-display);font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums}
.kcats{list-style:none;margin:0;padding:12px 0 0;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:10px}
.kcats li{display:grid;grid-template-columns:6.8em 1fr auto;align-items:center;gap:10px}
.kcats .nm{display:flex;align-items:center;gap:7px;font-size:.84rem}
.kcats .nm i{width:9px;height:9px;border-radius:50%;flex:none}
.kbar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.kbar span{display:block;height:100%;border-radius:999px;transition:width .4s}
.kcats .yen{font-family:var(--font-display);font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums;text-align:right}
.kitem{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--hair)}
.kitem:first-child{border-top:0}
.badge{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:.82rem;color:#4d4558}
.kitem .info{min-width:0}
.kitem .t{display:block;font-weight:700;overflow-wrap:anywhere}
.kitem .s{display:block;font-size:.74rem;color:var(--muted)}
.kitem .yen{font-family:var(--font-display);font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums}
.kdel{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:.74rem;padding:4px 6px;border-radius:8px}
.kdel.confirm{background:var(--sun);color:#fff}
.list{gap:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="25" cy="32" r="17" fill="var(--p1)" opacity=".85"/>
        <circle cx="39" cy="32" r="17" fill="var(--p2)" opacity=".85"/>
        <path d="M32 27.5c1.7-2.5 6-1.8 6 1.4 0 2.8-6 6.6-6 6.6s-6-3.8-6-6.6c0-3.2 4.3-3.9 6-1.4z" fill="#fff"/>
      </svg>
      <div>
        <h1>ふたりの家計簿</h1>
        <div class="names"><span class="tag" id="todayLine">—</span></div>
      </div>
    </div>
    <nav class="appnav" aria-label="ページの切り替え">
      <a href="index.html" aria-current="page"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3.5" width="12" height="9" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 6.5h12" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="9.5" r="1" fill="currentColor"/></svg><span>家計簿</span></a>
      <a href="calendar.html"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>カレンダー</span></a>
    </nav>
  </header>

  <p class="demo" id="demoNote" hidden>おためしモード：いまはこの端末だけに保存しています。「（例）」の記録は自由に消してください。</p>

  <section class="card" aria-labelledby="addTitle">
    <h2 id="addTitle">お買いものを記録</h2>
    <form id="form" class="kform" novalidate>
      <div class="amount"><span>¥</span><input id="amount" inputmode="numeric" placeholder="0" autocomplete="off" aria-label="金額（円）"></div>
      <div class="field"><span class="label">項目</span><div class="cats" id="catChips"></div></div>
      <div class="field"><span class="label">だれが払った？</span><div class="whos" id="payerChips"></div></div>
      <div class="field"><span class="label">支払い方法</span><div class="cats" id="methodChips"></div></div>
      <div class="two">
        <label class="field"><span class="label">何に払った？（メモ）</span><input type="text" id="memo" placeholder="例：スーパーで夕飯の材料" maxlength="60"></label>
        <label class="field"><span class="label">日付</span><input type="date" id="date"></label>
      </div>
      <p class="msg" id="msg" role="status"></p>
      <button class="save" id="saveBtn" type="submit">記録する</button>
    </form>
  </section>

  <section class="card" aria-label="月の集計">
    <div class="monthbar">
      <button class="round" id="prev" type="button" aria-label="前の月">‹</button>
      <div class="mtitle" id="mtitle">—</div>
      <button class="round" id="next" type="button" aria-label="次の月">›</button>
    </div>
    <div class="total"><span class="label">この月の支出の合計</span><span class="num" id="total">¥0</span></div>
    <div class="paygrid" id="who"></div>
    <ul class="kcats" id="cats"></ul>
  </section>

  <section class="card" aria-labelledby="listTitle">
    <h2 id="listTitle">明細</h2>
    <ul class="list" id="list"></ul>
  </section>

  <p class="note" id="syncNote">読み込み中…</p>
  <div style="display:flex;justify-content:center"><button type="button" class="logout" id="logout" hidden>この端末からログアウト</button></div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<div class="login" id="login" hidden>
  <form class="loginbox" id="loginForm" novalidate>
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="25" cy="32" r="17" fill="var(--p1)" opacity=".85"/>
      <circle cx="39" cy="32" r="17" fill="var(--p2)" opacity=".85"/>
      <path d="M32 27.5c1.7-2.5 6-1.8 6 1.4 0 2.8-6 6.6-6 6.6s-6-3.8-6-6.6c0-3.2 4.3-3.9 6-1.4z" fill="#fff"/>
    </svg>
    <h1>ふたり</h1>
    <p>ふたりで決めたパスワードを入れてください。<br>家計簿とカレンダーの両方が開きます。<br>この端末では次から入力しなくてOKです。</p>
    <label class="field"><span class="label">パスワード</span>
      <input type="password" id="pwInput" autocomplete="current-password" required></label>
    <p class="msg" id="pwMsg" role="status"></p>
    <button type="submit" class="save" id="pwBtn">ひらく</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== ここだけ書きかえてください ===== */
const SUPABASE_URL = "https://rrtxrjpjmpthjkjiqyfw.supabase.co";
const SUPABASE_KEY = "sb_publishable_r1NZQ7itKychuaLrJ1H36w_mFF4NGCQ";  // calendar.html と同じ鍵
/* ===================================== */
</script>
<script>
const CATS=[
  {id:"food",name:"食費",c:"#f6c3a8"},
  {id:"daily",name:"日用品",c:"#b9d9f2"},
  {id:"utility",name:"水道光熱費",c:"#f0dc9f"},
  {id:"wifi",name:"Wi-Fi",c:"#cdbfee"},
  {id:"fun",name:"外食・娯楽",c:"#f2b6c8"},
  {id:"misc",name:"雑費",c:"#b7e0cf"},
  {id:"other",name:"その他",c:"#d9d3df"}
];
const PAYERS=[
  {id:"joint",name:"共同カード",short:"共",c:"--p3",s:"--p3s"},
  {id:"husband",name:"哲也",short:"哲",c:"--p1",s:"--p1s"},
  {id:"wife",name:"菜々子",short:"菜",c:"--p2",s:"--p2s"}
];
const METHODS=[{id:"card",name:"クレジットカード"},{id:"paypay",name:"PayPay"},{id:"cash",name:"現金"}];
const $=id=>document.getElementById(id);
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
const pad=n=>String(n).padStart(2,"0");
const now=new Date();
const todayStr=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const curMonth=todayStr.slice(0,7);
const WD="日月火水木金土";
$("todayLine").textContent=`${now.getMonth()+1}月${now.getDate()}日（${WD[now.getDay()]}）`;
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

let state={cat:"food",payer:"joint",method:"card"};
let month=curMonth, items=[], store=null;

function chipRow(el,list,key,cls){
  el.innerHTML="";
  list.forEach(o=>{
    const b=document.createElement("button");b.type="button";b.className=cls;b.dataset.id=o.id;
    if(cls==="whobtn"){
      b.style.setProperty("--pc",`var(${o.c})`);b.style.setProperty("--ps",`var(${o.s})`);
      b.innerHTML=`<span class="ava"></span><span></span>`;b.querySelector(".ava").textContent=o.short;b.querySelector("span:last-child").textContent=o.name;
    }else{
      if(o.c){const d=document.createElement("i");d.className="dot";d.style.background=o.c;b.appendChild(d)}
      b.appendChild(document.createTextNode(o.name));
    }
    b.addEventListener("click",()=>{
      if(b.disabled)return;
      state[key]=o.id;
      if(key==="payer"){state.method=o.id==="joint"?"card":(state.method==="card"?"paypay":state.method)}
      sync();
    });
    el.appendChild(b);
  });
}
function sync(){
  [["catChips","cat"],["payerChips","payer"],["methodChips","method"]].forEach(([el,k])=>
    $(el).querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===state[k])));
  $("methodChips").querySelectorAll("button").forEach(b=>b.disabled=state.payer==="joint"&&b.dataset.id!=="card");
}
chipRow($("catChips"),CATS,"cat","cat");
chipRow($("payerChips"),PAYERS,"payer","whobtn");
chipRow($("methodChips"),METHODS,"method","cat");
sync();
$("date").value=todayStr;
$("amount").addEventListener("input",e=>{
  const v=e.target.value.replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-65248)).replace(/[^\d]/g,"");
  e.target.value=v?Number(v).toLocaleString("ja-JP"):"";
});
function monthLabel(m){const [y,mm]=m.split("-");return {y,m:Number(mm)}}
function shiftMonth(m,d){let [y,mm]=m.split("-").map(Number);mm+=d;if(mm<1){mm=12;y--}if(mm>12){mm=1;y++}return `${y}-${pad(mm)}`}

function render(){
  const ml=monthLabel(month);
  $("mtitle").innerHTML="";const sm=document.createElement("small");sm.textContent=ml.y+"年";
  $("mtitle").append(sm,document.createTextNode(ml.m+"月"));
  const mine=items.filter(i=>i.month===month).sort((a,b)=>(b.date+(b.created_at||"")).localeCompare(a.date+(a.created_at||"")));
  const total=mine.reduce((s,i)=>s+i.amount,0);
  $("total").textContent=yen(total);
  $("who").innerHTML="";
  PAYERS.forEach(p=>{
    const s=mine.filter(i=>i.payer===p.id).reduce((a,i)=>a+i.amount,0);
    const d=document.createElement("div");d.className="paytile";d.style.setProperty("--ps",`var(${p.s})`);d.style.setProperty("--pc",`var(${p.c})`);
    d.innerHTML=`<small><i></i><span></span></small><b></b>`;d.querySelector("span").textContent=p.name;d.querySelector("b").textContent=yen(s);
    $("who").appendChild(d);
  });
  const sums=CATS.map(c=>mine.filter(i=>i.cat===c.id).reduce((a,i)=>a+i.amount,0));
  const max=Math.max(1,...sums);
  $("cats").innerHTML="";
  CATS.forEach((c,ix)=>{
    const s=sums[ix];
    const li=document.createElement("li");
    li.innerHTML=`<span class="nm"><i></i><span></span></span><span class="kbar"><span></span></span><span class="yen"></span>`;
    li.querySelector(".nm i").style.background=c.c;li.querySelector(".kbar span").style.background=c.c;
    li.querySelector(".kbar span").style.width=(s/max*100)+"%";
    li.querySelector(".nm span").textContent=c.name;li.querySelector(".yen").textContent=yen(s);
    $("cats").appendChild(li);
  });
  const ul=$("list");ul.innerHTML="";
  if(!mine.length){ul.innerHTML=`<li class="empty">${ml.m}月の記録はまだありません。<br>上のフォームから最初のお買いものを登録しましょう。</li>`;return}
  mine.forEach(i=>{
    const c=CATS.find(x=>x.id===i.cat)||CATS[6];
    const p=PAYERS.find(x=>x.id===i.payer)||PAYERS[0];
    const m=METHODS.find(x=>x.id===i.method)?.name||"";
    const li=document.createElement("li");li.className="kitem";
    li.innerHTML=`<span class="badge"></span><span class="info"><span class="t"></span><span class="s"></span></span><span class="yen"></span><button class="kdel" type="button">削除</button>`;
    li.querySelector(".badge").style.background=c.c;li.querySelector(".badge").textContent=c.name.slice(0,1);
    li.querySelector(".t").textContent=i.memo||c.name;
    li.querySelector(".s").textContent=`${Number(i.date.slice(5,7))}/${Number(i.date.slice(8,10))}・${c.name}・${p.name}（${m}）`;
    li.querySelector(".yen").textContent=yen(i.amount);
    const del=li.querySelector(".kdel");
    del.addEventListener("click",async()=>{
      if(!del.classList.contains("confirm")){del.classList.add("confirm");del.textContent="本当に削除";setTimeout(()=>{del.classList.remove("confirm");del.textContent="削除"},3000);return}
      del.disabled=true;
      try{await store.remove(i.id);toast("削除しました");await reload()}catch(e){toast("削除できませんでした");del.disabled=false}
    });
    ul.appendChild(li);
  });
}
$("prev").onclick=()=>{month=shiftMonth(month,-1);reload()};
$("next").onclick=()=>{month=shiftMonth(month,1);reload()};

let toastT=null;
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const amount=Number($("amount").value.replace(/,/g,""));
  if(!amount||amount<=0){$("msg").textContent="金額を入力してください。";$("amount").focus();return}
  const date=$("date").value||todayStr;
  const rec={amount,cat:state.cat,payer:state.payer,method:state.method,memo:$("memo").value.trim(),date,month:date.slice(0,7)};
  $("saveBtn").disabled=true;$("msg").textContent="";
  try{
    await store.add(rec);
    toast(`${CATS.find(x=>x.id===rec.cat).name} ${yen(amount)} を記録しました`);
    $("amount").value="";$("memo").value="";
    month=rec.month;await reload();
  }catch(err){$("msg").textContent="記録できませんでした（"+(err.message||"通信エラー")+"）。"}
  finally{$("saveBtn").disabled=false}
});

/* ---- 保存先 ---- */
let PW=lsGet("futari-pw","");
function localStore(){
  const KEY="futari-kakeibo-demo";
  let all;try{all=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){all=null}
  if(!all){
    const d=n=>`${curMonth}-${pad(Math.min(n,now.getDate()))}`;
    all=[
      {id:"e1",amount:3280,cat:"food",payer:"joint",method:"card",memo:"スーパー（例）",date:d(1),month:curMonth,created_at:"1"},
      {id:"e2",amount:1200,cat:"fun",payer:"husband",method:"paypay",memo:"カフェ（例）",date:d(3),month:curMonth,created_at:"2"},
      {id:"e3",amount:5500,cat:"wifi",payer:"joint",method:"card",memo:"光回線（例）",date:d(5),month:curMonth,created_at:"3"},
      {id:"e4",amount:860,cat:"daily",payer:"wife",method:"cash",memo:"洗剤（例）",date:d(6),month:curMonth,created_at:"4"}
    ];
  }
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(all))}catch(e){}};save();
  return{kind:"local",
    list:async m=>all.filter(i=>i.month===m),
    add:async r=>{all.push(Object.assign({id:"l"+Date.now().toString(36),created_at:new Date().toISOString()},r));save()},
    remove:async id=>{all=all.filter(i=>i.id!==id);save()}};
}
function supabaseStore(){
  const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const chk=({data,error})=>{
    if(error){if(String(error.message).includes("wrong_password"))showLogin("パスワードが変わったようです。もう一度入れてください。");throw error}
    return data;
  };
  return{kind:"cloud",
    check:async pw=>{const {data,error}=await sb.rpc("futari_check",{pw});if(error)throw error;return data===true},
    list:async m=>chk(await sb.rpc("kb_list",{pw:PW,m}))||[],
    add:async r=>chk(await sb.rpc("kb_add",{pw:PW,row_data:r})),
    remove:async id=>chk(await sb.rpc("kb_delete",{pw:PW,expense_id:id}))};
}
function showLogin(msg){$("login").hidden=false;$("pwMsg").textContent=msg||"";$("pwInput").value="";setTimeout(()=>$("pwInput").focus(),50)}
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const pw=$("pwInput").value;
  if(!pw){$("pwMsg").textContent="パスワードを入れてください。";return}
  $("pwBtn").disabled=true;$("pwMsg").textContent="";
  try{
    if(await store.check(pw)){PW=pw;lsSet("futari-pw",pw);$("login").hidden=true;reload()}
    else $("pwMsg").textContent="パスワードがちがいます。";
  }catch(err){$("pwMsg").textContent="つながりませんでした（"+(err.message||"通信エラー")+"）。"}
  finally{$("pwBtn").disabled=false}
});
$("logout").addEventListener("click",()=>{PW="";try{localStorage.removeItem("futari-pw")}catch(e){}items=[];render();showLogin("ログアウトしました。")});

let loading=false;
async function reload(){
  render();
  if(!store||loading)return;
  if(store.kind==="cloud"&&!PW){showLogin();return}
  loading=true;
  try{
    items=(await store.list(month)).map(r=>Object.assign({},r,{amount:Number(r.amount),date:String(r.date).slice(0,10)}));
    if(store.kind==="cloud")$("syncNote").textContent="ふたりのスマホで同じ記録が見られます。最新："+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
  }catch(err){$("syncNote").textContent="記録を読み込めませんでした（"+(err.message||"通信エラー")+"）。"}
  finally{loading=false;render()}
}
(function start(){
  const ready=SUPABASE_URL.startsWith("https://")&&SUPABASE_KEY.length>20&&!SUPABASE_KEY.includes("ここに")&&window.supabase;
  if(ready){store=supabaseStore();$("logout").hidden=false}
  else{store=localStore();$("demoNote").hidden=false;$("syncNote").textContent="おためしモード：この端末だけに保存しています。"}
  reload();
  setInterval(()=>{if(document.visibilityState==="visible"&&$("login").hidden)reload()},30000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")reload()});
})();
</script>

</body>
